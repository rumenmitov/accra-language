[project]
name = "accra-language"
version = "0.1.0"
description = "Add your description here"
readme = "README.txt"
authors = [
    { name = "Rumen", email = "rumenmitov@disroot.org" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
accra-language = "accra_language:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
