name: check and format

on:
  push:

jobs:
  check-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run check
        run: uv run ruff check .

      - name: Run format
        run: uv run ruff format .
